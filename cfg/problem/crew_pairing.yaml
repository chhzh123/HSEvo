problem_name: crew_pairing
problem_type: covering
obj_type: min
problem_size: 1 # problem size for training
func_name: solve
description: Airlines must build pairings (multi-day sequences of flight legs) so that every scheduled leg is covered by exactly one legal crew duty-tour while respecting rules (such as maximum duty hours, minimum rest, domicile start/end, etc.). A feasible solution must Cover each flight leg exactly once. Respect all duty-time and rest constraints *within* every pairing. A pairing may begin at any airport.  If the first leg departs a station other than the base, the crew is assumed to position-fly there before the tour starts.  A flat positioning-cost will be charged for each such pairing. A pairing may end anywhere (crews dead-head home after the horizon). Given the increasing volume of flights, operational planners then need to choose the subset of pairings that minimises total cost (wages, per-diem, hotels) while ensuring sufficient reserve pilots remain at the base to absorb disruptions.  In our simplified benchmark we ignore reserve sizing and hotel detail; cost depends only on duty and block hours. Key definitions mathcal F - set of all scheduled flight legs (each leg is a single aircraft movement defined by departure station/time and arrival station/time); indexed by f. mathcal P - set of *feasible* pairings.  A pairing p in mathcal P is a sequence { f_1,dots,f_{|p|}} satisfying all of the following rules Chronological order mathrm{arr}(f_i) le mathrm{dep}(f_{i+1}). Each internal rest gap that splits duties is ge R_{min}. Within every duty segment dsubseteq p text{dutyHours}(d) le H^d_{max} text{blockHours}(d) le H^b_{max} |d| le L_{max}. Legal-rule parameters, Maximum duty span H^d_{max} = 14 h, Maximum block hours per duty H^b_{max} = 10 h, Maximum legs per duty L_{max} = 6, Minimum rest between consecutive duties R_{min} = 9 h, Base / domicile Base = NKX, Positioning fee C_{text{pos}} = 10000, Decision variables x_p = begin{cases} 1 & text{if pairing } p text{ is selected} 0 & text{otherwise} end{cases} qquad text{for all } p in mathcal{P} Cost of a pairing Let D_p be the set of duty segments inside pairing p and let F_p be its flight legs delta_p ;=; begin{cases} 1 & text{if } operatorname{depStn}(f_1) ne text{Base}, 0 & text{otherwise.} end{cases} Then, c_p = underbrace{sum_{din D_p} H^{text{duty}}_d}_{text{duty hours}},texttt{DutyCostPerHour} ; +; underbrace{sum_{fin F_p} H^{text{block}}_f}_{text{block hours}},texttt{ParingCostPerHour} ; +; delta_p,C_{text{pos}}. where * H^{duty}_d = clock-time length of duty d (report to release). * H^{block}_f = airborne/block time of flight leg f. Objective The objective is to minimize the total cost of the selected pairings begin{aligned} min_{x}; & sum_{pinmathcal P} c_p,x_p  text{s.t.}; & sum_{p:,fin p} x_p = 1 quad &forall fin mathcal F;; (text{each leg covered once})  & x_p in {0,1} &forall pinmathcal P end{aligned} The legality rules above are *baked into* the definition of mathcal P; hence no additional constraints are needed in the objective of problem.
