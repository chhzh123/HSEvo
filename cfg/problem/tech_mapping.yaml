problem_name: tech_mapping
problem_type: covering
obj_type: min
problem_size: 1 # problem size for training
func_name: solve
description: |
  Technology mapping is a critical stage in the FPGA design flow where a technology-independent logic network is transformed into a network of lookup tables (LUTs). A K-input lookup table (K-LUT) is a basic programmable logic element in FPGAs that can implement any Boolean function with up to K inputs. The quality of technology mapping directly impacts the area, performance, and power consumption of the final FPGA implementation. Here we consider the structural mapping problem, which consider the circuit graph as a given and find a covering of the graph with K-input subgraphs corresponding to LUTs. Our optimization target is to minimize the number of LUTs, which represents the area of the mapped logic network. This is an NP-hard problem. In this problem, we specify K = 6. Consider a directed acyclic graph (DAG) $G = (V, E)$ representing a Boolean network, where each node $v \in V$ represents a logic gate, and each edge $(u, v) \in E$ indicates that the output of node $u$ is an input to node $v$. Let $PI$ denote the set of primary inputs and $PO$ denote the set of primary outputs in the network. A primary input (PI) node is a node that has no input edges. A primary output (PO) node is a node that has no output edges. An internal node has both input and output edges. A cone of a node $v$, $Cone(v)$, is a subgraph consisting of $v$ and some of its non-PI predecessors, such that any node $u \in Cone(v)$ has a path to $v$ that lies entirely in $Cone(v)$. Node $v$ is the root of the cone. At a cone $Cone(v)$, the set of input edges iedge($Cone(v)$) is the set of edges with head in $Cone(v)$ and tail outside $Cone(v)$; and the set of output edges oedge($Cone(v)$) is the set of edges with $v$ as the tail. With input and output edges so defined, a cone can be viewed as a node, and notions of "inode", "onode", "K-feasibility" can be extended to handle cones. The set of distinct nodes that supplies input edges to $Cone(v)$ is referred to as $inode(Cone(v))$, and the set of distinct nodes that receives output edges from $Cone(v)$ is referred to as $onode(Cone(v))$. A cone $Cone(v)$ is K-feasible if $|inode(Cone(v))| \leq K$. A K-input LUT (K-LUT) can implement any K-feasible cone. Thus, the technology mapping problem for LUTs is selecting a set of K-feasible cones to cover the graph in such a way that: every edge in the graph is entirely within a cone, or is an output edge of a cone, or is the output edge of a PI node. In our area-optimal mapping problem, the number of cones selected to cover the graph is to be minimized. Formally, a mapping solution $M$ is to select a set of cones $Cone(v_1), Cone(v_2), \ldots, Cone(v_n)$, where $v_i \in V$ but $v_i \notin PI$, such that: - For each edge $e \in E$, $e$ is entirely within a cone, or is an output edge of a cone, or is the output edge of a PI node. - The cost to be minimized is the number of cones selected, i.e., $Cost(M) = |V'|$, where $V' = \{v_1, v_2, \ldots, v_n\}$. Here we specify K = 6 in our implementation. Note that there could be exponential explosion in the search space of the mapping solution, so you might need to prune the search space to make it feasible on real graphs. 