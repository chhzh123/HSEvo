problem_type: scheduling
obj_type: min
problem_size: 1 # problem size for training
func_name: solve
description: High-level synthesis (HLS) is an important stage in electronic design automation (EDA), aimed at translating a high-level program specification (e.g., written in C/C++ or SystemC) into a cycle-accurate hardware implementation. After the program is parsed and analyzed, it is typically transformed into an intermediate representation known as a Control Data Flow Graph (CDFG). This graph captures the operations (e.g., arithmetic, memory accesses) and their control/data dependencies. The CDFG can further be processed into a Directed Acyclic Graph (DAG) to facilitate scheduling and optimization. One of the core challenges in HLS is operator scheduling, which determines the exact control step (or cycle) at which each operation is executed, while satisfying data dependencies and resource constraints. Efficient scheduling plays a critical role in optimizing design quality in terms of performance, area, and power. Consider a CDFG with n operation nodes oi, where i \in O = \{1, 2, \ldots, n\}, and a precedence relation \prec on O that captures operation dependencies. Each operation oi is associated with a cycle delay di \in \mathbb{Z}^+ and a resource type ri \in R = \{1, 2, \ldots, k\}. Let T = \{0, 1, 2, \ldots, L\} represent the set of control steps (c-steps), and define a schedule as an n-tuple s = (t1, t2, \ldots, tn), where ti \in T denotes the start time (c-step) of operation oi. A schedule s is feasible if it satisfies all data dependencies \forall i, j \in O i \prec j \Rightarrow ti + di \leq tj. Let S denote the set of all feasible schedules. For a given schedule s, let Nr(t) be the number of operations that use resource r in control step t, and define the total usage of resource r as Nr = \sum{t \in T} Nr(t). Given a bound Gr on the number of available instances for each resource type r \in R, the operator scheduling problem is to find a feasible schedule s \in S that minimizes the overall latency L, defined as   \min{s \in S} \max{i \in O} (ti + di), subject to the resource constraints \forall r \in R, t \in T Nr(t) \leq Gr.
